# Fly.io (балама). fly launch --no-deploy; fly volumes create aibolat_data --size 1 --region waw; fly secrets set AI_API_KEY=... ; fly deploy
app = "ai-bolat"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "8790"
  PUBLIC_URL = "https://ai-bolat.fly.dev"
  DATA_LOCATION = "eu"

[mounts]
  source = "aibolat_data"
  destination = "/data"

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
