# AI-bolat — VPS (PS.kz / кез келген Linux сервер): Docker Compose + Caddy (автоматты HTTPS, Let's Encrypt)
# Іске қосу:  docker compose up -d --build      Журнал: docker compose logs -f app
services:
  app:
    build: .
    image: ai-bolat:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "8790"
      TRUST_PROXY: "1"
    volumes:
      - ./data:/data
    expose:
      - "8790"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env ішінде көрсетілуі керек}
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
